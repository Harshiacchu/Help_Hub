<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <link rel="stylesheet" href="../css/pages/customer-dashboard.css">
    
</head>
<body>
    <header>
        <div class="container"> 
            <h1>Welcome, User</h1>    
        </div>
    </header>
    <hr>
    <div class="container">
        <div class="row g-20">   
            <div class="col">
                <button class="btn btn-primary" id="new-ticket-btn">
                    + Submit A New Ticket
                </button>
            </div>
            <div class="col box" id="in-progress-box">
                <h2>Your In-Progress Tickets</h2>
                <div class="ticket-container">
                    <!--The customer's in progress tickets show up here-->
                </div>
                
            </div>
            <div class="col box" id="completed-box">
                <h2>Your Completed Tickets</h2>
                <div class="ticket-container">
                    <!--The customer's closed tickets show up here-->
                </div>
            </div>
        </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script type='module' src="../js/customer/dashboard.js"></script>
</body>
</html>
