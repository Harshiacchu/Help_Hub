<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/pages/customer-dashboard.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">HelpHub Customer Portal</span>
        <div>
          <span id="navbar-user" class="text-light me-3"></span>
          <button
            type="button"
            id="logout-btn"
            class="btn btn-sm btn-outline-light"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>
    <header>
      <div class="container">
        <h1>Welcome, User</h1>
      </div>
    </header>
    <hr />
    <div class="container">
      <div class="row g-4">
        <div class="col-12 col-lg-2">
          <button class="btn btn-primary" id="new-ticket-btn">
            + Submit A New Ticket
          </button>
        </div>
        <div class="col-12 col-md-6 col-lg-5">
          <div class="box d-flex flex-column" id="in-progress-box">
            <h2>Your Open Tickets</h2>
            <div class="ticket-container flex-grow-1 overflow-auto">
              <!--The customer's in progress tickets show up here-->
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-lg-5">
          <div class="box d-flex flex-column" id="completed-box">
            <h2>Your Completed Tickets</h2>
            <div class="ticket-container flex-grow-1 overflow-auto">
              <!--The customer's closed tickets show up here-->
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="form-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="ticket-form">
          <div class="modal-header">
            <h3 class="modal-title fs-5">Submit a new help ticket</h3>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="ticket-form-text-area" class="form-label"
                >Describe the issue in 1-3 sentences.</label
              >
              <textarea
                class="form-control"
                id="ticket-form-text-area"
                rows="3"
                maxlength="1000"
                required
              ></textarea>
            </div>
            <p class="text-danger mb-0" id="ticket-form-error"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              id="ticket-form-submit"
            >
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="../js/customer/dashboard.js"></script>
  </body>
</html>
