<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <link rel="stylesheet" href="../css/pages/agent-dashboard.css">
</head>
<body>
    <header class="d-flex justify-content-end px-4 pt-3">
        <button class="btn btn-outline-secondary" id="logout-btn">Log Out</button>
    </header>
    <div class="container-fluid">
        <div class="row">
            <div class="col-3">
                <div class="box" id="sidebar">
                    <h2>Summary</h2>
                    <div class="stat">
                        <span>Open</span>
                        <span class="stat-number" id="stat-open">0</span>
                    </div>
                    <div class="stat">
                        <span>In Progress</span>
                        <span class="stat-number" id="stat-in-progress">0</span>
                    </div>
                    <div class="stat">
                        <span>Waiting on Customer</span>
                        <span class="stat-number" id="stat-waiting">0</span>
                    </div>
                    <div class="stat">
                        <span>Closed</span>
                        <span class="stat-number" id="stat-closed">0</span>
                    </div>

                    <h2 class="mt-4">Queues</h2>
                    <nav class="queue-nav">
                        <a href="#" class="queue-link active" data-queue="mine">My Tickets</a>
                        <a href="#" class="queue-link" data-queue="closed">Recently Closed</a>
                    </nav>
                </div>
            </div>
            <div class="col-6">
                <div class="box" id="ticket-box">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 id="ticket-heading">My Tickets</h2>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary" id="sort-priority-btn" aria-pressed="false">
                                Sort by Priority: High to Low
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" id="sort-date-btn" aria-pressed="false">
                                Sort by Date: Oldest to Newest
                            </button>
                        </div>
                    </div>
                    <div class="overflow-auto" id="ticket-list">
                        <!--The agent's assigned tickets show up here-->
                    </div>
                </div>
            </div>
            <div class="col-3">
                <div class="box" id="stats-box">
                    <h2>At a Glance</h2>
                    <div class="stat">
                        <span>High Priority (not closed)</span>
                        <span class="stat-number" id="stat-high">0</span>
                    </div>
                    <div class="stat">
                        <span>Opened This Week</span>
                        <span class="stat-number" id="stat-opened-week">0</span>
                    </div>
                    <div class="stat">
                        <span>Closed This Week</span>
                        <span class="stat-number" id="stat-closed-week">0</span>
                    </div>
                    <div class="stat">
                        <span>Oldest Open (days)</span>
                        <span class="stat-number" id="stat-oldest">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/agent/dashboard.js"></script>
</body>
</html>
