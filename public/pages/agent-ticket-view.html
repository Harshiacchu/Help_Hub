<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Ticket</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/pages/customer-ticket-view.css" />
  </head>
  <body>
    <header>
      <div class="container" id="ticket-view-header">
        <a
          class="btn btn-outline-secondary"
          id="back-link"
          href="/pages/agent-dashboard.html"
          >Back to Dashboard</a
        >
        <div class="container">
          <h1 id="ticket-title">Viewing Ticket #000</h1>
          <label id="ticket-company">Issued to: COMPANY NAME</label>
        </div>
        <button class="btn btn-outline-secondary" id="logout-btn">
          Log Out
        </button>
      </div>
    </header>
    <div class="container my-3">
      <button class="btn btn-success" id="complete-ticket-btn">
        Mark this ticket as completed
      </button>
      <button class="btn btn-outline-danger" id="escalate-btn" hidden>
        Escalate to admin
      </button>
      <p class="alert alert-warning mt-3" id="escalation-info" hidden></p>
      <form id="escalate-form" class="mt-3" hidden>
        <label for="escalate-reason" class="form-label"
          >Why are you escalating this ticket?</label
        >
        <select class="form-select" id="escalate-reason" required>
          <option value="">Choose a reason</option>
          <option value="needs_approval">Needs an admin's approval</option>
          <option value="beyond_access">Outside what I can resolve</option>
          <option value="unhappy_customer">Customer asked for a manager</option>
          <option value="other">Other</option>
        </select>
        <label for="escalate-note" class="form-label mt-2"
          >Note for the admin</label
        >
        <textarea
          class="form-control"
          id="escalate-note"
          rows="3"
          maxlength="1000"
          required
        ></textarea>
        <p class="text-danger" id="escalate-error"></p>
        <button type="submit" class="btn btn-danger" id="escalate-submit">
          Escalate
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary"
          id="escalate-cancel"
        >
          Cancel
        </button>
      </form>
    </div>
    <hr />
    <div class="container">
      <div class="space"></div>
      <div class="row">
        <div class="col">
          <div class="info-box">
            <label>Status:</label>
            <p id="ticket-status"></p>
            <label>Priority:</label>
            <p id="ticket-priority"></p>
            <label>Issue Category:</label>
            <p id="ticket-category"></p>
            <label>Received via:</label>
            <p id="ticket-source"></p>
            <label>Issue description:</label>
            <p id="ticket-description">DESCRIPTION .......</p>
          </div>
        </div>
      </div>
      <div class="space"></div>
      <div class="row">
        <div class="comment-container">
          <div id="comment-container"></div>
          <p class="text-muted" id="comment-closed" hidden>
            This ticket is closed, so no more comments can be added.
          </p>
          <form id="comment-form">
            <textarea
              class="form-control"
              id="comment-text"
              rows="2"
              maxlength="2000"
              required
            ></textarea>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="comment-internal"
              />
              <label class="form-check-label" for="comment-internal"
                >Internal note (hidden from the customer)</label
              >
            </div>
            <p class="text-danger" id="comment-error"></p>
            <button type="submit" class="btn btn-primary" id="comment-submit">
              Send
            </button>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="../js/agent/ticket-view.js"></script>
  </body>
</html>
