<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - HelpHub</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components/cards.css" />
    <link rel="stylesheet" href="../css/components/forms.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/alerts.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
          <div class="card shadow">
            <div class="card-body p-5">
              <h1 class="card-title text-center mb-4">HelpHub Login</h1>

              <form id="loginForm">
                <!-- Organization (tenant slug) -->
                <div class="mb-3">
                  <label for="tenantSlug" class="form-label"
                    >Organization</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="tenantSlug"
                    name="tenantSlug"
                    placeholder="e.g., acme-corp"
                    autocomplete="organization"
                    required
                  />
                  <small class="text-muted"
                    >Your company's slug, chosen when it registered</small
                  >
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label">Email Address</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    autocomplete="username"
                    required
                  />
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                  />
                </div>

                <!-- Remember Me -->
                <div class="mb-3 form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="rememberMe"
                    name="rememberMe"
                    checked
                  />
                  <label class="form-check-label" for="rememberMe"
                    >Keep me signed in for 7 days</label
                  >
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 py-2">
                  Login
                </button>
              </form>

              <!-- Links -->
              <div class="text-center mt-4">
                <p class="text-muted mb-2">
                  Have a share code?
                  <a href="register.html">Create your account</a>
                </p>
                <p class="text-muted">
                  New organization?
                  <a href="register-tenant.html">Register organization</a>
                </p>
              </div>

              <!-- Alert -->
              <div id="alertContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/auth/login.js"></script>
  </body>
</html>
